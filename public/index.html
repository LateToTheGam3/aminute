<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>aminute — the news, in a minute</title>
<meta name="description" content="Business, finance and geopolitics in 60 words — with the context, the why, and the jargon explained." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<meta name="theme-color" content="#f9f5e9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1c1a14" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="aminute" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Nunito+Sans:wght@300..800&display=swap" rel="stylesheet">
<style>
  /* Newsprint cream + ink. One brand accent (deep green); gold reserved for rewards.
     Wordmark: Comfortaa (stand-in for the licensed "aminute" font — drop-in later).
     Headlines/summaries: Newsreader (newspaper serif). UI: Nunito Sans. */
  :root {
    --bg: #f0ebdd;
    --card: #f9f5e9;
    --text: #22201a;
    --text-2: #57524a;
    --text-3: #8f8878;
    --accent: #0c6b5c;
    --gold: #b97d18;
    --line: #e2dbc8;
    --drawer: #f9f5e9;
    --shadow: rgba(60, 50, 30, 0.10);
  }
  [data-theme="dark"] {
    --bg: #13120e;
    --card: #1c1a14;
    --text: #ece7dc;
    --text-2: #b5aea1;
    --text-3: #7e776a;
    --accent: #3bbfa4;
    --gold: #e0a63f;
    --line: #2b2820;
    --drawer: #181610;
    --shadow: rgba(0, 0, 0, 0.55);
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  /* One family throughout — same as the headlines, just smaller.
     Size and weight carry the hierarchy, not competing typefaces. */
  body {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .serif { font-family: "Newsreader", Georgia, serif; }
  body.bionic .b { font-weight: 700; }

  /* ---------- Top bar (always visible; clears the notch) ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: calc(56px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 14px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    box-shadow: 0 1px 4px var(--shadow);
    z-index: 30;
  }
  .topbar .left, .topbar .right { display: flex; align-items: center; gap: 4px; }
  /* Masthead sits dead centre, like a newspaper — independent of the buttons. */
  .topbar .logo {
    position: absolute;
    left: 50%;
    top: env(safe-area-inset-top);
    height: 56px;
    display: flex;
    align-items: center;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .logo {
    font-family: "Comfortaa", "Newsreader", serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-transform: lowercase;
    user-select: none;
  }
  .logo span { color: var(--accent); }
  .iconbtn {
    width: 40px; height: 40px;
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 19px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .iconbtn:active { background: var(--line); }
  .cat-label {
    position: fixed;
    top: calc(56px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 7px 0;
    z-index: 20;
    pointer-events: none;
  }

  /* ---------- Feed ---------- */
  .feed {
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    /* No `scroll-behavior: smooth` here — under mandatory scroll-snap the
       browser cancels smooth programmatic scrolls, which silently kills the
       arrow keys. Touch scrolling is natively smooth regardless. */
    scrollbar-width: none;
  }
  .feed::-webkit-scrollbar { display: none; }
  .card {
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    background: var(--card);
    position: relative;
  }
  .card .img {
    height: 26%;
    min-height: 130px;
    background: var(--line);
    flex-shrink: 0;
  }
  .card .cover {
    position: relative;
    display: flex;
    align-items: flex-end;
    padding: 14px 20px;
  }
  .card .photo { position: relative; overflow: hidden; background: var(--line); }
  .card .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  /* If the publisher pulls or moves the image, fall back to the flat tint
     rather than showing a broken-image icon. */
  .card .photo.failed img { display: none; }
  .card .photo .credit {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 16px 20px 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  .card .photo.failed .credit {
    color: var(--text-2);
    text-shadow: none;
    background: none;
  }
  .cover-mark {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-2);
    opacity: 0.75;
  }
  .card .body {
    flex: 1;
    position: relative;
    min-height: 0;
    padding: 16px 20px 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }
  /* Article text scrolls in here; the action row below is pinned. Previously
     everything shared one clipped box, so a long story pushed the buttons —
     including "Break it down" — off the bottom of the card entirely. Scroll
     chaining stays on so reaching the end still swipes to the next card. */
  .card .scroller {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .card .scroller::-webkit-scrollbar { display: none; }
  /* Mirror of the fade above the action row. Without it, text scrolled up
     inside the card is sliced mid-line against the photo and reads as two
     elements overlapping rather than as content continuing above. Only shown
     once actually scrolled, so an unscrolled card stays clean. */
  .card .body::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 26px;
    background: linear-gradient(to bottom, var(--card) 30%, transparent);
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s ease;
    z-index: 2;
  }
  .card.scrolled .body::before { opacity: 1; }

  /* With the breakdown open the summary has already been read, so it gives up
     its space rather than forcing the reader to scroll a cramped region — the
     scrolling was what sliced text against the photo and looked like overlap.
     Two lines are kept so the card still has context at a glance. */
  .card.expanded .summary {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity: .6;
  }
  .card.expanded .why {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .foot {
    flex-shrink: 0;
    padding-bottom: 8px;
    background: var(--card);
    position: relative;
  }
  /* Soft fade above the action row so text clipped by the scroll region reads
     as "there's more below", not as a rendering fault. */
  .card .foot::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: -22px;
    height: 22px;
    background: linear-gradient(to bottom, transparent, var(--card));
    pointer-events: none;
  }
  .chipline {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .chipline em { color: var(--text-3); font-style: normal; }
  .card h2 {
    font-family: "Newsreader", Georgia, serif;
    font-size: 26px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 11px;
  }
  .card .summary {
    font-family: "Newsreader", Georgia, serif;
    font-size: 17px;
    line-height: 1.58;
    font-weight: 400;
    color: var(--text-2);
  }
  .jargon {
    border-bottom: 2px dotted var(--accent);
    cursor: pointer;
  }
  .why {
    margin-top: 12px;
    flex-shrink: 0;
    padding: 10px 13px;
    border-left: 3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border-radius: 0 10px 10px 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-2);
  }
  .why b, .explain b.tag {
    display: block;
    font-size: 10px;
    letter-spacing: 1.6px;
    color: var(--accent);
    margin-bottom: 3px;
    font-weight: 800;
  }
  .explain {
    margin-top: 10px;
    padding: 10px 13px;
    border-left: 3px solid var(--gold);
    background: color-mix(in srgb, var(--gold) 8%, transparent);
    border-radius: 0 10px 10px 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-2);
    flex-shrink: 0;
  }
  .explain b.tag { color: var(--gold); }
  /* With the breakdown open, the 60-word summary has already been read —
     trim it to a few lines so the explanation gets the room. */
  .explain ul { margin: 2px 0 0; padding-left: 18px; }
  .explain li { margin-bottom: 6px; }
  .explain li:last-child { margin-bottom: 0; }
  .card .meta {
    padding: 10px 0 8px;
    font-size: 12.5px;
    color: var(--text-3);
  }
  .card .meta b { color: var(--text-2); font-weight: 600; }
  .card .actions { display: flex; gap: 8px; padding-bottom: 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 20px;
    cursor: pointer;
  }
  .chip:active { background: var(--line); }
  .chip.gold { border-color: color-mix(in srgb, var(--gold) 45%, transparent); color: var(--gold); font-weight: 600; }
  .offline {
    position: fixed;
    top: calc(56px + env(safe-area-inset-top));
    left: 0; right: 0;
    background: var(--gold);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    padding: 5px;
    z-index: 29;
    display: none;
  }
  body.offline-mode .offline { display: block; }

  .card .readmore {
    display: block;
    text-align: center;
    padding: 13px 13px calc(13px + env(safe-area-inset-bottom));
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(90deg, #0c6b5c, #09523f);
    text-decoration: none;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }
  [data-theme="dark"] .card .readmore { background: linear-gradient(90deg, #14574b, #0e4038); }

  /* ---------- Quiz FAB ---------- */
  .fab {
    position: fixed;
    bottom: 64px;
    right: max(16px, calc(50% - 300px));
    z-index: 26;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(135deg, var(--gold), #96650f);
    padding: 12px 18px;
    border-radius: 26px;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--shadow);
    display: none;
  }
  .fab.show { display: block; }
  .fab .dot {
    display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
    background: rgba(255,255,255,0.25); border-radius: 9px; font-size: 11px; margin-left: 6px;
  }

  /* ---------- Quiz overlay ---------- */
  .quiz {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 90;
    display: none;
    overflow-y: auto;
  }
  .quiz.open { display: block; }
  .quiz .inner { max-width: 500px; margin: 0 auto; padding: 18px 20px 40px; }
  .quiz .qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .quiz .qhead h1 { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 24px; font-weight: 800; }
  .quiz .qhead h1 span { color: var(--gold); }
  .quiz .dots { display: flex; gap: 6px; margin: 10px 0 22px; }
  .quiz .dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .quiz .dots i.on { background: var(--gold); }
  .quiz .tag {
    font-size: 10.5px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .quiz .question { font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 20px; }
  .quiz .opt {
    display: block; width: 100%;
    text-align: left;
    font-family: inherit; font-size: 15px; font-weight: 500;
    color: var(--text);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz .opt.right { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .quiz .opt.wrong { border-color: #c0392b; opacity: 0.7; }
  .quiz .opt:disabled { cursor: default; }
  .quiz .feedback {
    margin-top: 14px; padding: 13px 15px; border-radius: 12px;
    font-size: 14px; line-height: 1.55; display: none;
  }
  .quiz .feedback.show { display: block; }
  .quiz .feedback.good { background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: var(--text-2); border-left: 3px solid var(--accent); }
  .quiz .feedback.bad { background: color-mix(in srgb, var(--gold) 10%, var(--card)); color: var(--text-2); border-left: 3px solid var(--gold); }
  .quiz .feedback .xp { font-weight: 800; color: var(--gold); }
  .quiz .next {
    margin-top: 16px; width: 100%;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #fff;
    background: var(--accent); border: none; border-radius: 14px;
    padding: 14px; cursor: pointer; display: none;
  }
  .quiz .next.show { display: block; }
  .quiz .done { text-align: center; padding-top: 4vh; }
  .quiz .done .big { font-family: "Fraunces", Georgia, serif; font-size: 32px; font-weight: 900; margin: 10px 0 4px; }
  .quiz .done .sub { color: var(--text-2); font-size: 15px; line-height: 1.6; max-width: 380px; margin: 0 auto 22px; }
  .levelbox {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px; text-align: left; margin-bottom: 14px;
  }
  .levelbox .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
  .levelbox .row .lvl { color: var(--accent); }
  .levelbox .row .xpnum { color: var(--gold); }
  .levelbox .bar { height: 7px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .levelbox .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent)); border-radius: 4px; transition: width 0.6s ease; }
  .levelbox .streak { font-size: 12.5px; color: var(--text-3); margin-top: 8px; }

  /* ---------- Drawer ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0;
    width: min(310px, 84vw);
    background: var(--drawer);
    z-index: 50;
    transform: translateX(-105%);
    transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1);
    box-shadow: 4px 0 24px var(--shadow);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .head { padding: 24px 22px 16px; border-bottom: 1px solid var(--line); }
  .drawer .head .logo { font-size: 27px; }
  .drawer .head p { font-size: 12px; color: var(--text-3); margin: 4px 0 14px; }
  .drawer nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .drawer nav button {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 14px 22px;
    border: none; background: transparent;
    color: var(--text-2);
    font-family: inherit; font-size: 15px; font-weight: 500;
    cursor: pointer; text-align: left;
  }
  .drawer nav button.active {
    color: var(--accent); font-weight: 700;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .drawer nav button:active { background: var(--line); }
  .settingrow {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 15px 22px;
    border: none; border-top: 1px solid var(--line);
    background: transparent; color: var(--text-2);
    font-family: inherit; font-size: 15px;
    cursor: pointer;
  }
  .settingrow:active { background: var(--line); }
  .settingrow .pill {
    font-size: 12px; font-weight: 600;
    padding: 3px 11px; border-radius: 12px;
    background: var(--line); color: var(--text-3);
  }
  .settingrow .pill.on { background: var(--accent); color: #fff; }
  .drawer .foot { padding: 14px 22px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-3); }

  /* ---------- Sheet, states, toast ---------- */
  .sheet-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 70;
  }
  .sheet-scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0;
    transform: translateX(-50%) translateY(110%);
    width: min(480px, 100vw);
    background: var(--card);
    border-radius: 18px 18px 0 0;
    padding: 22px 22px 30px;
    z-index: 80;
    transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1);
    box-shadow: 0 -6px 30px var(--shadow);
  }
  .sheet.open { transform: translateX(-50%) translateY(0); }
  .sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
  .sheet h3 { font-family: "Fraunces", Georgia, serif; font-size: 19px; font-weight: 800; margin-bottom: 8px; text-transform: capitalize; }
  .sheet h3::before { content: "📖 "; }
  .sheet p { font-size: 15px; line-height: 1.55; color: var(--text-2); }

  .state {
    height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; color: var(--text-3); text-align: center; padding: 30px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--text); color: var(--card);
    padding: 10px 20px; border-radius: 22px; font-size: 13px;
    z-index: 95; transition: transform 0.3s ease; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (min-width: 700px) {
    .card, .cat-label { max-width: 480px; margin: 0 auto; }
    .card { box-shadow: 0 0 24px var(--shadow); }
    .topbar { max-width: 480px; left: 50%; transform: translateX(-50%); }
  }
</style>
</head>
<body data-theme="light">

  <header class="topbar">
    <div class="left">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
    </div>
    <div class="logo">aminute<span>.</span></div>
    <div class="right">
      <button class="iconbtn" id="bioBtn" aria-label="Toggle bionic reading"><span style="font-size:15px"><b>B</b><span style="font-weight:300">r</span></span></button>
      <button class="iconbtn" id="refreshBtn" aria-label="Refresh">&#8635;</button>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode">&#9789;</button>
    </div>
  </header>
  <div class="cat-label" id="catLabel">My Feed</div>
  <div class="offline">⚡ Offline — showing your last saved minute</div>

  <main class="feed" id="feed">
    <div class="state"><div class="spinner"></div><div>Fetching your minute…</div></div>
  </main>

  <button class="fab" id="quizFab">🎯 Daily 3 <span class="dot">+30</span></button>

  <!-- Quiz overlay -->
  <div class="quiz" id="quiz">
    <div class="inner">
      <div class="qhead">
        <h1 class="serif">Daily <span>3</span></h1>
        <button class="iconbtn" id="quizClose" aria-label="Close quiz">✕</button>
      </div>
      <div id="quizBody"></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="head">
      <div class="logo">aminute<span>.</span></div>
      <p>the news, in a minute</p>
    </div>
    <nav id="catNav"></nav>
    <button class="settingrow" id="reminderBtn">
      <span>Daily reminder</span>
      <span class="pill" id="reminderState">Off</span>
    </button>
    <div class="foot">
      aminute · news via public feeds · not investment advice<br>
      <a href="/privacy.html" style="color:var(--text-3)">Privacy</a>
    </div>
  </aside>

  <div class="sheet-scrim" id="sheetScrim"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h3 id="sheetTerm"></h3>
    <p id="sheetMeaning"></p>
  </div>

  <div class="toast" id="toast"></div>

<script src="glossary.js"></script>
<script>
  const CATEGORIES = [
    ['all', '🗞️', 'My Feed'],
    ['business', '💼', 'Business'],
    ['finance', '💹', 'Finance'],
    ['geopolitics', '🌍', 'Geopolitics'],
  ];

  // Inside the iOS app the page is served from capacitor://localhost, so a
  // relative /api/… would hit the app bundle rather than the backend. On the
  // web (http/https) relative URLs are correct and keep dev and prod honest.
  const API_BASE = /^https?:$/.test(location.protocol)
    ? ''
    : 'https://aminute-0eqg.onrender.com';

  const feed = document.getElementById('feed');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const catNav = document.getElementById('catNav');
  const catLabel = document.getElementById('catLabel');
  const toast = document.getElementById('toast');

  let currentCat = 'all';
  let currentLabel = 'My Feed';

  // ---------- XP / levels / streak ----------
  const LEVELS = [
    ['Intern', 0], ['Analyst', 50], ['Associate', 150],
    ['VP', 350], ['Director', 700], ['Managing Director', 1200],
  ];
  function getStats() {
    try { return Object.assign({ xp: 0, streak: 0, lastQuiz: '' }, JSON.parse(localStorage.getItem('stats') || '{}')); }
    catch { return { xp: 0, streak: 0, lastQuiz: '' }; }
  }
  function setStats(s) { localStorage.setItem('stats', JSON.stringify(s)); renderLevelBox(); }
  function levelInfo(xp) {
    let i = 0;
    while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][1]) i++;
    const cur = LEVELS[i], next = LEVELS[i + 1];
    const pct = next ? Math.min(100, Math.round(((xp - cur[1]) / (next[1] - cur[1])) * 100)) : 100;
    return { name: cur[0], next: next ? next[0] : null, toNext: next ? next[1] - xp : 0, pct };
  }
  function levelBoxHtml() {
    const s = getStats();
    const L = levelInfo(s.xp);
    return `
      <div class="row"><span class="lvl">💼 ${L.name}</span><span class="xpnum">${s.xp} XP</span></div>
      <div class="bar"><i style="width:${L.pct}%"></i></div>
      <div class="streak">${L.next ? `${L.toNext} XP to ${L.next}` : 'Top of the ladder'} · 🔥 ${s.streak}-day streak</div>`;
  }
  // Level box lived in the drawer alongside the quiz. Both are shelved —
  // XP can't be earned without the quiz, so showing "Intern · 0 XP" forever
  // was dead furniture. Kept as a no-op so the quiz code still runs if revived.
  function renderLevelBox() {}

  // ---------- Drawer ----------
  function buildNav() {
    catNav.innerHTML = '';
    for (const [id, , label] of CATEGORIES) {
      const b = document.createElement('button');
      b.textContent = label;
      b.className = id === currentCat ? 'active' : '';
      b.onclick = () => { closeDrawer(); load(id); };
      catNav.appendChild(b);
    }
  }
  const openDrawer = () => { drawer.classList.add('open'); scrim.classList.add('open'); };
  const closeDrawer = () => { drawer.classList.remove('open'); scrim.classList.remove('open'); };
  document.getElementById('menuBtn').onclick = openDrawer;
  scrim.onclick = closeDrawer;

  // ---------- Theme ----------
  const themeBtn = document.getElementById('themeBtn');
  function setTheme(t) {
    document.body.dataset.theme = t;
    localStorage.setItem('theme', t);
    themeBtn.innerHTML = t === 'dark' ? '&#9788;' : '&#9789;';
  }
  themeBtn.onclick = () => setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
  setTheme(localStorage.getItem('theme') || 'light');

  // ---------- Bionic ----------
  const bioBtn = document.getElementById('bioBtn');
  function setBionic(on) {
    document.body.classList.toggle('bionic', on);
    localStorage.setItem('bionic', on ? '1' : '0');
    bioBtn.style.color = on ? 'var(--accent)' : '';
  }
  bioBtn.onclick = () => {
    const on = !document.body.classList.contains('bionic');
    setBionic(on);
    showToast(on ? 'Bionic reading on' : 'Bionic reading off');
  };
  setBionic(localStorage.getItem('bionic') === '1');

  // ---------- Helpers ----------
  function timeAgo(iso) {
    if (!iso) return '';
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} hours ago`;
    return `${Math.floor(s / 86400)} days ago`;
  }
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function shorten(text, words = 60) {
    const w = text.split(/\s+/);
    return w.length <= words ? text : w.slice(0, words).join(' ') + '…';
  }
  const esc = (s) => s.replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function bionicHtml(text) {
    return text.split(/(\s+)/).map((tok) => {
      const m = tok.match(/^([A-Za-zÀ-ÿ']+)([\s\S]*)$/);
      if (!m || m[1].length < 2) return esc(tok);
      const n = Math.ceil(m[1].length * 0.4);
      return `<span class="b">${esc(m[1].slice(0, n))}</span>${esc(m[1].slice(n))}${esc(m[2])}`;
    }).join('');
  }

  function annotate(text, aiJargon) {
    const candidates = [];
    for (const j of aiJargon || []) candidates.push({ term: j.term, meaning: j.meaning });
    const glossaryTerms = Object.keys(window.GLOSSARY || {}).sort((a, b) => b.length - a.length);
    for (const t of glossaryTerms) {
      if (!candidates.some((c) => c.term.toLowerCase() === t.toLowerCase())) {
        candidates.push({ term: t, meaning: window.GLOSSARY[t] });
      }
    }
    const marks = [];
    for (const c of candidates) {
      if (marks.length >= 4) break;
      const m = text.match(new RegExp(`\\b${reEsc(c.term)}\\b`, 'i'));
      if (!m) continue;
      const start = m.index, end = m.index + m[0].length;
      if (marks.some((k) => start < k.end && end > k.start)) continue;
      marks.push({ start, end, term: c.term, meaning: c.meaning });
    }
    marks.sort((a, b) => a.start - b.start);
    let html = '', pos = 0;
    for (const k of marks) {
      html += bionicHtml(text.slice(pos, k.start));
      html += `<span class="jargon" data-term="${esc(k.term)}" data-meaning="${esc(k.meaning)}">${bionicHtml(text.slice(k.start, k.end))}</span>`;
      pos = k.end;
    }
    return html + bionicHtml(text.slice(pos));
  }

  // ---------- Jargon sheet ----------
  const sheet = document.getElementById('sheet');
  const sheetScrim = document.getElementById('sheetScrim');
  function openSheet(term, meaning) {
    document.getElementById('sheetTerm').textContent = term;
    document.getElementById('sheetMeaning').textContent = meaning;
    sheet.classList.add('open');
    sheetScrim.classList.add('open');
  }
  function closeSheet() { sheet.classList.remove('open'); sheetScrim.classList.remove('open'); }
  sheetScrim.onclick = closeSheet;
  sheet.onclick = closeSheet;
  feed.addEventListener('click', (e) => {
    const j = e.target.closest('.jargon');
    if (j) openSheet(j.dataset.term, j.dataset.meaning);
  });

  // ---------- Feed ----------
  // Infinite scroll: pages are appended as the reader nears the end, so the
  // feed keeps going instead of stopping dead at one screenful.
  let loadedCount = 0, hasMore = true, loadingMore = false;

  async function loadMore() {
    if (loadingMore || !hasMore) return;
    loadingMore = true;
    try {
      const res = await fetch(`${API_BASE}/api/news?category=${currentCat}&offset=${loadedCount}`);
      const data = await res.json();
      if (data.items && data.items.length) {
        for (const item of data.items) feed.appendChild(buildCard(item));
        updateProgress();
      }
      // Advance by the window the server consumed, not the cards it returned:
      // stories rejected by the accuracy guards are skipped, not retried.
      loadedCount = data.nextOffset ?? (loadedCount + (data.items?.length || 0));
      hasMore = !!data.hasMore;
    } catch {
      // Offline or server down — keep what we have and try again later.
    } finally {
      loadingMore = false;
      watchTail();
    }
  }

  // Trigger the next page when the reader nears the end. An IntersectionObserver
  // is used rather than the scroll event: under mandatory scroll-snap the scroll
  // handler fires unreliably, and a feed that stops dead is worse than an extra
  // fetch. The observer re-arms itself after every appended page.
  let tailObserver = null;
  function watchTail() {
    if (tailObserver) tailObserver.disconnect();
    if (!hasMore) return;
    const cards = feed.querySelectorAll('.card');
    if (!cards.length) return;
    const sentinel = cards[Math.max(0, cards.length - 5)];
    tailObserver = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) loadMore();
    }, { root: feed, rootMargin: '100% 0px' });
    tailObserver.observe(sentinel);
  }

  async function load(cat) {
    currentCat = cat;
    currentLabel = CATEGORIES.find(c => c[0] === cat)[2];
    catLabel.textContent = currentLabel;
    buildNav();
    feed.innerHTML = '<div class="state"><div class="spinner"></div><div>Fetching your minute…</div></div>';
    loadedCount = 0;
    hasMore = true;
    loadingMore = false;
    try {
      const res = await fetch(`${API_BASE}/api/news?category=${cat}&offset=0`);
      const data = await res.json();
      // An empty feed with stories in the pool means the AI key is missing —
      // say so plainly rather than showing a generic connection error.
      if (data.aiConfigured === false) {
        feed.innerHTML = `<div class="state">
          <div style="font-size:40px">🔑</div>
          <div><strong>Setup incomplete</strong><br>
          GEMINI_API_KEY isn't set on the server, so no stories can be
          published.<br>Add it under Environment in your Render dashboard.</div>
        </div>`;
        return;
      }
      if (!data.items || !data.items.length) throw new Error('empty');
      // Served from cache because the server was unreachable — say so.
      stale = res.headers.get('x-from-cache') === '1';
      setOnlineState();
      loadedCount = data.nextOffset ?? data.items.length;
      hasMore = !!data.hasMore;
      render(data.items);
    } catch (e) {
      feed.innerHTML = `<div class="state">
        <div style="font-size:40px">📡</div>
        <div>Couldn't load the news.<br>Check your connection.</div>
        <button class="chip" onclick="load('${cat}')">Try again</button>
      </div>`;
    }
  }

  function render(items) {
    feed.innerHTML = '';
    for (const item of items) {
      const card = buildCard(item);
      feed.appendChild(card);
    }
    feed.scrollTop = 0;
    updateProgress();
    scheduleQuietRefresh();
    watchTail();
  }

  // Enrichment of the whole feed takes a couple of minutes on the free tier,
  // so a fast scroller can outrun it. Quietly swap in completed cards — but
  // only ones ahead of where the reader currently is, never the card in hand.
  let quietTimer = null;
  function scheduleQuietRefresh(delay = 45000) {
    clearTimeout(quietTimer);
    quietTimer = setTimeout(quietRefresh, delay);
  }
  async function quietRefresh() {
    if (document.hidden) return scheduleQuietRefresh(20000);
    let items;
    try {
      const res = await fetch(`${API_BASE}/api/news?category=${currentCat}`);
      items = (await res.json()).items;
    } catch { return; }
    if (!items || !items.length) return;

    const cards = [...feed.querySelectorAll('.card')];
    const reading = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    let upgraded = 0, pending = 0;
    items.forEach((item, n) => {
      const card = cards[n];
      if (!card) return;
      if (!item.whyItMatters) { pending++; return; }
      if (card.dataset.enriched === '1') return;
      if (n <= reading + 1) { pending++; return; } // don't touch what's in view
      card.replaceWith(buildCard(item));
      upgraded++;
    });
    if (pending) scheduleQuietRefresh(45000);
  }

  // Generated cover instead of the publisher's photograph. Feed images are
  // almost always agency-licensed (Getty, Reuters, AP), and those agencies
  // enforce far harder than newspapers do. This is deterministic per story,
  // needs no network, and can never be a rights problem.
  const COVER_HUES = { business: 168, finance: 150, geopolitics: 196, all: 174 };

  // Photograph supplied by the publisher's feed, hot-linked from their own
  // CDN — never copied or re-hosted, so it disappears the moment they pull it.
  // The credit is not decoration: attribution is the difference between a
  // polite email and a demand letter. Al Jazeera and CNBC ship no images, so
  // those fall through to the generated cover.
  let coverCount = 0;
  function buildPhoto(item) {
    const url = item.image.replace(/"/g, '%22');
    // The first screenful is fetched eagerly — a lazily-loaded cover pops in
    // after the reader is already looking at the card.
    const loading = coverCount++ < 4 ? 'eager' : 'lazy';
    const label = (item.sources && item.sources.length > 1)
      ? `${item.sources.length} sources · ${esc(item.source)}`
      : esc(item.source);
    return `<div class="img photo">
        <img src="${url}" alt="" loading="${loading}"
             onerror="this.closest('.img').classList.add('failed')">
        <span class="credit">${label}</span>
      </div>`;
  }

  function buildCover(item) {
    if (item.image) return buildPhoto(item);
    let h = 0;
    for (const ch of item.id || item.title) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const base = COVER_HUES[item.category] ?? 174;
    const hue = (base + (h % 40) - 20 + 360) % 360;
    const angle = 110 + (h % 140);
    const dark = document.body.dataset.theme === 'dark';
    const c1 = `hsl(${hue} ${dark ? 38 : 46}% ${dark ? 17 : 82}%)`;
    const c2 = `hsl(${(hue + 34) % 360} ${dark ? 30 : 40}% ${dark ? 11 : 70}%)`;
    const label = (item.sources && item.sources.length > 1)
      ? `${item.sources.length} sources`
      : esc(item.source);
    return `<div class="img cover" style="background:linear-gradient(${angle}deg, ${c1}, ${c2})">
        <span class="cover-mark">${esc(label)}</span>
      </div>`;
  }

  function buildCard(item) {
    {
      const card = document.createElement('article');
      card.className = 'card';
      if (item.whyItMatters) card.dataset.enriched = '1';
      const img = buildCover(item);
      const whyHtml = item.whyItMatters
        ? `<div class="why"><b>WHY IT MATTERS</b>${annotate(item.whyItMatters, item.jargon)}</div>`
        : '';
      card.innerHTML = `
        ${img}
        <div class="body">
          <div class="scroller">
            <div class="chipline">${esc((item.category || 'news'))} <em>· ${esc(item.source)}</em></div>
            <h2></h2>
            <div class="summary"></div>
            ${whyHtml}
            <div class="explain" style="display:none"></div>
          </div>
          <div class="foot">
            <div class="meta"><span></span></div>
            <div class="actions">
              <button class="chip share">Share ↗</button>
              <button class="chip open">Open article</button>
              <button class="chip gold breakdown">🧩 Break it down</button>
            </div>
          </div>
        </div>
        <a class="readmore" href="${item.url}" target="_blank" rel="noopener">Tap to read the full story at ${item.source}</a>`;
      card.querySelector('h2').innerHTML = bionicHtml(item.title);
      card.querySelector('.summary').innerHTML = annotate(shorten(item.summary || ''), item.jargon);
      card.querySelector('.meta span').textContent = timeAgo(item.publishedAt);
      card.querySelector('.share').onclick = async () => {
        const payload = { title: item.title, url: item.url };
        if (navigator.share) { try { await navigator.share(payload); } catch {} }
        else { await navigator.clipboard.writeText(item.url); showToast('Link copied'); }
      };
      card.querySelector('.open').onclick = () => window.open(item.url, '_blank');
      const scroller = card.querySelector('.scroller');
      scroller.addEventListener('scroll', () => {
        card.classList.toggle('scrolled', scroller.scrollTop > 4);
      }, { passive: true });

      const bd = card.querySelector('.breakdown');
      const panel = card.querySelector('.explain');
      bd.onclick = async () => {
        if (panel.style.display !== 'none') {
          panel.style.display = 'none';
          card.classList.remove('expanded');
          bd.textContent = '🧩 Break it down';
          return;
        }
        if (!panel.dataset.loaded) {
          bd.textContent = '🧩 Breaking it down…';
          try {
            // POST the story itself: the server's memory of an article is not
            // durable (cache expiry, pool churn, free-tier restarts), and we
            // already hold everything the explainer needs.
            const r = await fetch(`${API_BASE}/api/explain`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                id: item.id,
                title: item.origTitle || item.title,
                summary: item.summary,
                whyItMatters: item.whyItMatters,
                sources: item.sources,
              }),
            });
            const d = await r.json();
            if (!d.points || !d.points.length) throw new Error();
            panel.innerHTML = `<b class="tag">🧩 BROKEN DOWN — FOR BEGINNERS</b><ul>${
              d.points.map((p) => `<li>${annotate(p, item.jargon)}</li>`).join('')
            }</ul>`;
            panel.dataset.loaded = '1';
          } catch {
            bd.textContent = '🧩 Break it down';
            showToast('Explainer unavailable right now');
            return;
          }
        }
        panel.style.display = 'block';
        card.classList.add('expanded');
        bd.textContent = '🧩 Hide breakdown';
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      };
      return card;
    }
  }

  document.getElementById('refreshBtn').onclick = () => { load(currentCat); showToast('Refreshed'); };

  // ---------- Progress ----------
  function updateProgress() {
    const total = feed.querySelectorAll('.card').length;
    if (!total) { catLabel.textContent = currentLabel; return; }
    const idx = Math.min(total, Math.round(feed.scrollTop / (feed.clientHeight || 1)) + 1);
    // No "of 40" — the feed is endless, so a denominator would be a lie.
    catLabel.textContent = `${currentLabel} · ${idx}`;
  }
  feed.addEventListener('scroll', () => requestAnimationFrame(() => {
    updateProgress();
    // Fetch the next page well before the reader gets there, so the feed
    // never visibly stops.
    const total = feed.querySelectorAll('.card').length;
    const idx = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    if (total - idx <= 5) loadMore();
  }), { passive: true });

  // ---------- Daily 3 quiz ----------
  const quizEl = document.getElementById('quiz');
  const quizBody = document.getElementById('quizBody');
  const quizFab = document.getElementById('quizFab');
  let quizData = null;

  async function fetchQuiz(attempt = 0) {
    try {
      const r = await fetch(`${API_BASE}/api/quiz`);
      if (!r.ok) throw new Error();
      quizData = await r.json();
      if (quizData && quizData.questions) { quizFab.classList.add('show'); return; }
      throw new Error();
    } catch {
      if (attempt < 4) setTimeout(() => fetchQuiz(attempt + 1), 20000);
    }
  }

  function openQuiz() {
    if (!quizData) return;
    quizEl.classList.add('open');
    runQuiz();
  }
  function closeQuiz() { quizEl.classList.remove('open'); }
  quizFab.onclick = openQuiz;
  document.getElementById('quizClose').onclick = closeQuiz;

  function runQuiz() {
    const qs = quizData.questions;
    const today = new Date().toISOString().slice(0, 10);
    const firstRunToday = getStats().lastQuiz !== today;
    let i = 0, correctCount = 0, earned = 0;

    function dots() {
      return `<div class="dots">${qs.map((_, n) => `<i class="${n <= i ? 'on' : ''}"></i>`).join('')}</div>`;
    }

    function showQuestion() {
      const q = qs[i];
      quizBody.innerHTML = `
        ${dots()}
        <div class="tag">${esc(q.story || 'Today\'s news')}</div>
        <div class="question">${esc(q.q)}</div>
        ${q.options.map((o, n) => `<button class="opt" data-n="${n}">${esc(o)}</button>`).join('')}
        <div class="feedback" id="qFeedback"></div>
        <button class="next" id="qNext">${i < qs.length - 1 ? 'Next question' : 'Finish'}</button>`;
      quizBody.querySelectorAll('.opt').forEach((btn) => {
        btn.onclick = () => answer(Number(btn.dataset.n));
      });
      document.getElementById('qNext').onclick = () => {
        i++;
        if (i < qs.length) showQuestion();
        else finish();
      };
    }

    function answer(n) {
      const q = qs[i];
      const fb = document.getElementById('qFeedback');
      quizBody.querySelectorAll('.opt').forEach((b) => {
        b.disabled = true;
        const bn = Number(b.dataset.n);
        if (bn === q.correct) b.classList.add('right');
        else if (bn === n) b.classList.add('wrong');
      });
      if (n === q.correct) {
        correctCount++;
        const xp = firstRunToday ? 10 : 0;
        earned += xp;
        fb.className = 'feedback show good';
        fb.innerHTML = `${xp ? `<span class="xp">+${xp} XP</span> · ` : ''}${esc(q.affirmation || "You're now up to speed on this — you can bring it up with a peer or in an interview.")}`;
      } else {
        const xp = firstRunToday ? 5 : 0;
        earned += xp;
        fb.className = 'feedback show bad';
        fb.innerHTML = `${xp ? `<span class="xp">+${xp} XP</span> for learning it · ` : ''}${esc(q.recap || 'Worth a second look — re-read the card in your feed.')} <br><span style="font-size:12.5px;color:var(--text-3)">Now you know it — that still counts.</span>`;
      }
      document.getElementById('qNext').classList.add('show');
    }

    function finish() {
      const s = getStats();
      if (firstRunToday) {
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        s.streak = s.lastQuiz === yesterday ? s.streak + 1 : 1;
        s.lastQuiz = today;
        s.xp += earned;
        setStats(s);
      }
      const L = levelInfo(getStats().xp);
      quizBody.innerHTML = `
        <div class="done">
          <div style="font-size:44px">${correctCount === 3 ? '🏆' : correctCount >= 2 ? '🎯' : '📚'}</div>
          <div class="big serif">${correctCount}/3 · ${firstRunToday ? `+${earned} XP` : 'already banked today'}</div>
          <div class="sub">That's 3 stories you can now speak about — with a coursemate, a colleague, or in an interview. Come back tomorrow to keep the streak.</div>
          <div class="levelbox">${levelBoxHtml()}</div>
          <button class="next show" id="qDone">Back to the feed</button>
        </div>`;
      document.getElementById('qDone').onclick = closeQuiz;
    }

    showQuestion();
  }

  // ---------- Keyboard ----------
  function flip(delta) {
    const cards = feed.querySelectorAll('.card');
    if (!cards.length) return;
    const idx = Math.round(feed.scrollTop / feed.clientHeight);
    const next = Math.min(Math.max(idx + delta, 0), cards.length - 1);
    // Instant, not smooth: mandatory scroll-snap cancels smooth programmatic
    // scrolls, so `behavior: 'smooth'` here would do nothing at all.
    cards[next].scrollIntoView();
  }
  document.addEventListener('keydown', (e) => {
    if (quizEl.classList.contains('open')) {
      if (e.key === 'Escape') closeQuiz();
      return;
    }
    const k = e.key || e.code || String(e.keyCode);
    if (['ArrowDown', ' ', 'Space', '40', '32'].includes(k)) { flip(1); e.preventDefault(); }
    if (['ArrowUp', '38'].includes(k)) { flip(-1); e.preventDefault(); }
    if (k === 'Escape' || k === '27') { closeDrawer(); closeSheet(); }
  });

  // ---------- Daily reminder ----------
  // Uses Capacitor LocalNotifications when running as the iOS app: the
  // notification is scheduled BY THE DEVICE, so there is no notification
  // server, no APNs certificate and no per-message cost, and it fires even
  // with no signal. On the web there is no reliable daily scheduler, so the
  // preference is stored and honoured once the app is installed.
  const reminderBtn = document.getElementById('reminderBtn');
  const reminderState = document.getElementById('reminderState');
  const REMINDER_ID = 1;
  const nativeNotifications = () => window.Capacitor?.Plugins?.LocalNotifications;

  function paintReminder() {
    const on = localStorage.getItem('reminder') === '1';
    reminderState.textContent = on ? '8:00 am' : 'Off';
    reminderState.classList.toggle('on', on);
  }

  async function enableReminder() {
    const LN = nativeNotifications();
    if (LN) {
      const perm = await LN.requestPermissions();
      if (perm.display !== 'granted') return { ok: false, why: 'Notifications are off in iOS Settings' };
      await LN.cancel({ notifications: [{ id: REMINDER_ID }] });
      await LN.schedule({
        notifications: [{
          id: REMINDER_ID,
          title: 'Your minute is ready',
          body: "Today's business, finance and geopolitics — in about a minute.",
          schedule: { on: { hour: 8, minute: 0 }, repeats: true, allowWhileIdle: true },
        }],
      });
      return { ok: true, why: 'Reminder set for 8:00 am' };
    }
    // Web: no dependable daily scheduler, so record the choice for the app.
    if ('Notification' in window && Notification.permission !== 'granted') {
      if (await Notification.requestPermission() !== 'granted') {
        return { ok: false, why: 'Notifications blocked in browser settings' };
      }
    }
    return { ok: true, why: 'Saved — reminders arrive in the app' };
  }

  reminderBtn.onclick = async () => {
    if (localStorage.getItem('reminder') === '1') {
      localStorage.setItem('reminder', '0');
      await nativeNotifications()?.cancel({ notifications: [{ id: REMINDER_ID }] });
      paintReminder();
      showToast('Daily reminder off');
      return;
    }
    const res = await enableReminder();
    if (!res.ok) { showToast(res.why); return; }
    localStorage.setItem('reminder', '1');
    paintReminder();
    showToast(res.why);
  };
  paintReminder();

  // ---------- Offline awareness ----------
  // `stale` covers the case the banner used to miss: the phone has signal but
  // the server is unreachable, so the service worker replays old cards.
  let stale = false;
  function setOnlineState() {
    document.body.classList.toggle('offline-mode', !navigator.onLine || stale);
  }
  window.addEventListener('online', () => { stale = false; setOnlineState(); load(currentCat); });
  window.addEventListener('offline', setOnlineState);
  setOnlineState();

  // ---------- Haptics on card change (native feel) ----------
  let lastCardIdx = 0;
  feed.addEventListener('scroll', () => {
    const idx = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    if (idx !== lastCardIdx) {
      lastCardIdx = idx;
      if (navigator.vibrate) navigator.vibrate(8);
    }
  }, { passive: true });

  // ---------- Service worker (offline shell + last-known news) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  renderLevelBox();
  load('all');
  // Daily 3 quiz shelved for now (framing needs rework — see /api/quiz).
  // Re-enable with: fetchQuiz();
</script>
</body>
</html>
